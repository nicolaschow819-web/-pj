name: Build IPA for iPhone

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd PinchSplatAR
          xcodegen generate

      - name: Build App
        run: |
          cd PinchSplatAR
          xcodebuild build \
            -project PinchSplatAR.xcodeproj \
            -scheme PinchSplatAR \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to Unsigned IPA
        run: |
          cd PinchSplatAR
          mkdir -p build/Payload
          cp -r $(find ~/Library/Developer/Xcode/DerivedData -name "PinchSplatAR.app" | head -n 1) build/Payload/
          cd build
          zip -r PinchSplatAR.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinchSplatAR-IPA
          path: PinchSplatAR/build/PinchSplatAR.ipa
